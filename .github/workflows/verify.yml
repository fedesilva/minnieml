name: Compiler verification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    env:
      MML_SBT: sbt
      SBT_OPTS: -Dsbt.server.autostart=false
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm, macos-26]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/coursier
            ~/Library/Caches/Coursier
            ~/.ivy2/cache
            ~/.sbt/boot
          key: deps-${{ runner.os }}-${{ runner.arch }}-jdk25-${{ hashFiles('build.sbt', 'project/**', '.scalafix.conf') }}
      - name: Install verification tools
        run: bash scripts/ci/setup.sh
      - name: Verify compiler and measure benchmarks
        run: python3 scripts/ci/verify.py run
      - name: Write run summary
        if: always()
        run: python3 scripts/ci/verify.py report
      - name: Retain reports and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-${{ matrix.runner }}-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: error
          path: |
            build/ci/
            build/test-smoke/**/*.log
            build/test-mem-logs/
            **/test-reports/
